<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolution of HTTP</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #fafaf9; --color-ink: #1c1917; --color-muted: #78716c;
      --color-soft: #a8a29e; --color-accent: #059669; --color-link: #0891b2;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline &middot; Diagram Design</p>
    <h1>Evolution of HTTP</h1>
    <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evolution-of-http-title evolution-of-http-desc">
      <title id="evolution-of-http-title">Evolution of HTTP</title>
      <desc id="evolution-of-http-desc">A timeline diagram illustrating evolution of http.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#78716c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0891b2"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#fafaf9"/>
      <path d="M 220,208 H 260" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="220" y="188" width="40" height="12" rx="2" fill="#fafaf9"/>
      <text x="240" y="197" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVE</text>
      <path d="M 400,208 H 440" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="400" y="188" width="40" height="12" rx="2" fill="#fafaf9"/>
      <text x="420" y="197" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVE</text>
      <path d="M 580,208 H 620" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="580" y="188" width="40" height="12" rx="2" fill="#fafaf9"/>
      <text x="600" y="197" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVE</text>
      <path d="M 760,208 H 800" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="760" y="188" width="40" height="12" rx="2" fill="#fafaf9"/>
      <text x="780" y="197" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVOLVE</text>
      <rect x="80" y="180" width="140" height="56" rx="6" fill="#fafaf9"/>
      <rect x="80" y="180" width="140" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="88" y="186" width="28" height="12" rx="2" fill="transparent" stroke="#1c1917" stroke-width="0.8"/>
      <text x="102" y="195" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V1</text>
      <text x="150" y="212" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <rect x="260" y="180" width="140" height="56" rx="6" fill="#fafaf9"/>
      <rect x="260" y="180" width="140" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="268" y="186" width="28" height="12" rx="2" fill="transparent" stroke="#1c1917" stroke-width="0.8"/>
      <text x="282" y="195" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V2</text>
      <text x="330" y="212" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DNS</text>
      <rect x="440" y="180" width="140" height="56" rx="6" fill="#fafaf9"/>
      <rect x="440" y="180" width="140" height="56" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
      <rect x="448" y="186" width="28" height="12" rx="2" fill="transparent" stroke="#059669" stroke-width="0.8"/>
      <text x="462" y="195" fill="#059669" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V3</text>
      <text x="510" y="212" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TCP</text>
      <rect x="620" y="180" width="140" height="56" rx="6" fill="#fafaf9"/>
      <rect x="620" y="180" width="140" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="628" y="186" width="28" height="12" rx="2" fill="transparent" stroke="#1c1917" stroke-width="0.8"/>
      <text x="642" y="195" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V4</text>
      <text x="690" y="212" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TLS</text>
      <rect x="800" y="180" width="140" height="56" rx="6" fill="#fafaf9"/>
      <rect x="800" y="180" width="140" height="56" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="808" y="186" width="28" height="12" rx="2" fill="transparent" stroke="#1c1917" stroke-width="0.8"/>
      <text x="822" y="195" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">V5</text>
      <text x="870" y="212" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP Request</text>
      <line x1="30" y1="300" x2="970" y2="300" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="30" y="316" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="308" width="8" height="8" rx="2" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1"/>
      <text x="114" y="316" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Current</text>
      <rect x="170" y="308" width="8" height="8" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="184" y="316" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Stage</text>
    </svg>
  </div>
</body>
</html>
