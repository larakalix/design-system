<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load Balancer Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf9;
      --color-ink:     #1c1917;
      --color-muted:   #78716c;
      --color-soft:    #a8a29e;
      --color-accent:  #059669;
      --color-accent-tint: rgba(5,150,105,0.08);
      --color-link:    #0891b2;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Load Balancer Architecture</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lb-title lb-desc">
      <title id="lb-title">Load Balancer Architecture</title>
      <desc id="lb-desc">A three-tier architecture showing client requests flowing through DNS and a load balancer to three web servers, with shared database and cache backends.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#78716c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0891b2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf9"/>

      <!-- Zone: Public Zone -->
      <rect x="20" y="80" width="960" height="160" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="32" y="84" width="80" height="12" rx="2" fill="#fafaf9"/>
      <text x="72" y="93" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUBLIC</text>

      <!-- Zone: Application Tier -->
      <rect x="20" y="260" width="960" height="120" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="32" y="264" width="100" height="12" rx="2" fill="#fafaf9"/>
      <text x="82" y="273" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>

      <!-- Zone: Data Tier -->
      <rect x="20" y="400" width="960" height="100" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="32" y="404" width="60" height="12" rx="2" fill="#fafaf9"/>
      <text x="62" y="413" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA</text>

      <!-- Arrows (drawn before nodes) -->

      <!-- Client -> DNS -->
      <path d="M 120,140 H 232" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="144" y="116" width="64" height="12" rx="2" fill="#fafaf9"/>
      <text x="176" y="125" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

      <!-- DNS -> LB -->
      <path d="M 320,140 H 432" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="344" y="116" width="64" height="12" rx="2" fill="#fafaf9"/>
      <text x="376" y="125" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE</text>

      <!-- LB -> Web A -->
      <path d="M 520,180 V 260" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="476" y="212" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="500" y="221" fill="#059669" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

      <!-- LB -> Web B -->
      <path d="M 560,180 V 212 Q 560,220 568,220 H 632 Q 640,220 640,228 V 260" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- LB -> Web C -->
      <path d="M 560,180 V 212 Q 560,220 568,220 H 832 Q 840,220 840,228 V 260" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Web A -> DB -->
      <path d="M 500,340 V 372 Q 500,380 508,380 H 632 Q 640,380 640,388 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="560" y="356" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="584" y="365" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <!-- Web A -> Cache -->
      <path d="M 460,340 V 372 Q 460,380 452,380 H 308 Q 300,380 300,388 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="356" y="356" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="380" y="365" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE</text>

      <!-- Web B -> DB -->
      <path d="M 640,340 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Web C -> DB -->
      <path d="M 840,340 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Nodes -->

      <!-- Client -->
      <rect x="40" y="116" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="40" y="116" width="80" height="48" rx="6" fill="rgba(120,113,108,0.10)" stroke="#a8a29e" stroke-width="1"/>
      <rect x="48" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="62" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="80" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>

      <!-- DNS -->
      <rect x="240" y="116" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="240" y="116" width="80" height="48" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <rect x="248" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="262" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="280" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DNS</text>

      <!-- Load Balancer (Focal) -->
      <rect x="440" y="108" width="120" height="64" rx="6" fill="#fafaf9"/>
      <rect x="440" y="108" width="120" height="64" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
      <rect x="448" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(5,150,105,0.50)" stroke-width="0.8"/>
      <text x="462" y="123" fill="rgba(5,150,105,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
      <text x="500" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Load Balancer</text>
      <text x="500" y="160" fill="#78716c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Round Robin</text>

      <!-- Web Server A -->
      <rect x="460" y="268" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="460" y="268" width="80" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="468" y="274" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="482" y="283" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="500" y="302" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web A</text>

      <!-- Web Server B -->
      <rect x="600" y="268" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="600" y="268" width="80" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="608" y="274" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="622" y="283" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="640" y="302" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web B</text>

      <!-- Web Server C -->
      <rect x="800" y="268" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="800" y="268" width="80" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="808" y="274" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="822" y="283" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="840" y="302" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web C</text>

      <!-- Cache -->
      <rect x="260" y="420" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="260" y="420" width="80" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <rect x="268" y="426" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="282" y="435" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
      <text x="300" y="454" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>

      <!-- Database -->
      <rect x="600" y="420" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="600" y="420" width="80" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <rect x="608" y="426" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="622" y="435" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="640" y="454" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>

      <!-- Legend -->
      <line x1="30" y1="496" x2="970" y2="496" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="30" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="504" width="8" height="8" rx="2" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1"/>
      <text x="116" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Focal Component</text>
      <rect x="220" y="504" width="8" height="8" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="236" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Backend Service</text>
      <rect x="340" y="504" width="8" height="8" rx="2" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <text x="356" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Data Store</text>
      <rect x="440" y="504" width="8" height="8" rx="2" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="456" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">External</text>
    </svg>
  </div>
</body>
</html>
