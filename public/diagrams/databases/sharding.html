<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Sharding Strategy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf9;
      --color-ink:     #1c1917;
      --color-muted:   #78716c;
      --color-soft:    #a8a29e;
      --color-accent:  #059669;
      --color-accent-tint: rgba(5,150,105,0.08);
      --color-link:    #0891b2;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Database Sharding Strategy</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shard-title shard-desc">
      <title id="shard-title">Database Sharding Strategy</title>
      <desc id="shard-desc">An architecture diagram showing how a query router distributes writes and reads across three database shards based on a hash of the user ID.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#78716c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0891b2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf9"/>

      <!-- Zone: Application -->
      <rect x="20" y="80" width="960" height="120" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="32" y="84" width="100" height="12" rx="2" fill="#fafaf9"/>
      <text x="82" y="93" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>

      <!-- Zone: Shard Layer -->
      <rect x="20" y="220" width="960" height="140" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="32" y="224" width="80" height="12" rx="2" fill="#fafaf9"/>
      <text x="72" y="233" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARD LAYER</text>

      <!-- Arrows -->

      <!-- App -> Router -->
      <path d="M 200,140 V 172 Q 200,180 208,180 H 392 Q 400,180 400,172 V 140" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="264" y="168" width="72" height="12" rx="2" fill="#fafaf9"/>
      <text x="300" y="177" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE/READ</text>

      <!-- Router -> Shard A -->
      <path d="M 460,200 V 260" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="416" y="228" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="440" y="237" fill="#059669" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HASH 0</text>

      <!-- Router -> Shard B -->
      <path d="M 500,200 V 228 Q 500,236 508,236 H 632 Q 640,236 640,228 V 200" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="556" y="216" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="580" y="225" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HASH 1</text>

      <!-- Router -> Shard C -->
      <path d="M 500,200 V 228 Q 500,236 508,236 H 832 Q 840,236 840,228 V 200" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="756" y="216" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="780" y="225" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HASH 2</text>

      <!-- Shard A -> Replica A -->
      <path d="M 440,340 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="396" y="376" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="420" y="385" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLICA</text>

      <!-- Shard B -> Replica B -->
      <path d="M 640,340 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Shard C -> Replica C -->
      <path d="M 840,340 V 420" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Nodes -->

      <!-- Application -->
      <rect x="140" y="116" width="120" height="48" rx="6" fill="#fafaf9"/>
      <rect x="140" y="116" width="120" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="148" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="162" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="200" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application</text>

      <!-- Query Router (Focal) -->
      <rect x="360" y="108" width="140" height="64" rx="6" fill="#fafaf9"/>
      <rect x="360" y="108" width="140" height="64" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
      <rect x="368" y="114" width="36" height="12" rx="2" fill="transparent" stroke="rgba(5,150,105,0.50)" stroke-width="0.8"/>
      <text x="386" y="123" fill="rgba(5,150,105,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
      <text x="430" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Query Router</text>
      <text x="430" y="160" fill="#78716c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user_id % 3</text>

      <!-- Shard A -->
      <rect x="400" y="268" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="400" y="268" width="80" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <rect x="408" y="274" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="422" y="283" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARD</text>
      <text x="440" y="302" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shard A</text>

      <!-- Shard B -->
      <rect x="600" y="268" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="600" y="268" width="80" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <rect x="608" y="274" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="622" y="283" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARD</text>
      <text x="640" y="302" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shard B</text>

      <!-- Shard C -->
      <rect x="800" y="268" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="800" y="268" width="80" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <rect x="808" y="274" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="822" y="283" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARD</text>
      <text x="840" y="302" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shard C</text>

      <!-- Replica A -->
      <rect x="400" y="420" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="400" y="420" width="80" height="48" rx="6" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="408" y="426" width="36" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="426" y="435" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPL</text>
      <text x="440" y="454" fill="#78716c" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replica A</text>

      <!-- Replica B -->
      <rect x="600" y="420" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="600" y="420" width="80" height="48" rx="6" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="608" y="426" width="36" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="626" y="435" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPL</text>
      <text x="640" y="454" fill="#78716c" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replica B</text>

      <!-- Replica C -->
      <rect x="800" y="420" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="800" y="420" width="80" height="48" rx="6" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="808" y="426" width="36" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="826" y="435" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPL</text>
      <text x="840" y="454" fill="#78716c" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replica C</text>

      <!-- Legend -->
      <line x1="30" y1="496" x2="970" y2="496" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="30" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="504" width="8" height="8" rx="2" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1"/>
      <text x="116" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Focal</text>
      <rect x="160" y="504" width="8" height="8" rx="2" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <text x="176" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Shard</text>
      <rect x="240" y="504" width="8" height="8" rx="2" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="256" y="512" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Replica</text>
    </svg>
  </div>
</body>
</html>
