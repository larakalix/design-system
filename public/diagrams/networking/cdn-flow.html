<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN Request Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafaf9;
      --color-ink:     #1c1917;
      --color-muted:   #78716c;
      --color-soft:    #a8a29e;
      --color-accent:  #059669;
      --color-accent-tint: rgba(5,150,105,0.08);
      --color-link:    #0891b2;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow · Diagram Design</p>
    <h1>CDN Request Flow</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cdn-title cdn-desc">
      <title id="cdn-title">CDN Request Flow</title>
      <desc id="cdn-desc">A data flow diagram showing how a client request for static assets is served from a nearby CDN edge cache, with cache misses falling back to the origin server.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#78716c"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#059669"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0891b2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafaf9"/>

      <!-- Zone: User -->
      <rect x="20" y="80" width="220" height="140" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="32" y="84" width="60" height="12" rx="2" fill="#fafaf9"/>
      <text x="62" y="93" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

      <!-- Zone: Edge -->
      <rect x="260" y="80" width="340" height="140" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="272" y="84" width="80" height="12" rx="2" fill="#fafaf9"/>
      <text x="312" y="93" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EDGE NETWORK</text>

      <!-- Zone: Origin -->
      <rect x="620" y="80" width="360" height="140" rx="8" fill="rgba(28,25,23,0.02)" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <rect x="632" y="84" width="80" height="12" rx="2" fill="#fafaf9"/>
      <text x="672" y="93" fill="rgba(28,25,23,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ORIGIN</text>

      <!-- Arrows -->

      <!-- Client -> DNS -->
      <path d="M 120,140 H 232" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="148" y="116" width="56" height="12" rx="2" fill="#fafaf9"/>
      <text x="176" y="125" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOOKUP</text>

      <!-- DNS -> Edge POP -->
      <path d="M 320,140 H 432" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="348" y="116" width="56" height="12" rx="2" fill="#fafaf9"/>
      <text x="376" y="125" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

      <!-- Edge POP -> Cache Check -->
      <path d="M 520,140 H 632" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="548" y="116" width="56" height="12" rx="2" fill="#fafaf9"/>
      <text x="576" y="125" fill="#059669" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text>

      <!-- Cache Hit -> Client (return path) -->
      <path d="M 576,180 V 212 Q 576,220 568,220 H 352 Q 344,220 344,212 V 180" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow-accent)" stroke-dasharray="5,4"/>
      <rect x="436" y="200" width="48" height="12" rx="2" fill="#fafaf9"/>
      <text x="460" y="209" fill="#059669" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>

      <!-- Cache Miss -> Origin -->
      <path d="M 680,180 V 212 Q 680,220 688,220 H 752 Q 760,220 760,212 V 180" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
      <rect x="700" y="200" width="52" height="12" rx="2" fill="#fafaf9"/>
      <text x="726" y="209" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>

      <!-- Origin -> Edge (populate) -->
      <path d="M 840,180 V 260 Q 840,268 832,268 H 688 Q 680,268 680,260 V 228" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="740" y="252" width="68" height="12" rx="2" fill="#fafaf9"/>
      <text x="774" y="261" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POPULATE</text>

      <!-- Edge -> Client (after miss) -->
      <path d="M 344,180 V 260 Q 344,268 336,268 H 176 Q 168,268 168,260 V 228" fill="none" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="228" y="252" width="56" height="12" rx="2" fill="#fafaf9"/>
      <text x="256" y="261" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPOND</text>

      <!-- Nodes -->

      <!-- Client -->
      <rect x="60" y="116" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="60" y="116" width="80" height="48" rx="6" fill="rgba(120,113,108,0.10)" stroke="#a8a29e" stroke-width="1"/>
      <rect x="68" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="82" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="100" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>

      <!-- DNS -->
      <rect x="240" y="116" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="240" y="116" width="80" height="48" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <rect x="248" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="262" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="280" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DNS</text>

      <!-- Edge POP (Focal) -->
      <rect x="440" y="108" width="120" height="64" rx="6" fill="#fafaf9"/>
      <rect x="440" y="108" width="120" height="64" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
      <rect x="448" y="114" width="28" height="12" rx="2" fill="transparent" stroke="rgba(5,150,105,0.50)" stroke-width="0.8"/>
      <text x="462" y="123" fill="rgba(5,150,105,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="500" y="144" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CDN POP</text>
      <text x="500" y="160" fill="#78716c" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Nearest Node</text>

      <!-- Cache -->
      <rect x="640" y="116" width="80" height="48" rx="6" fill="#fafaf9"/>
      <rect x="640" y="116" width="80" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#78716c" stroke-width="1"/>
      <rect x="648" y="122" width="36" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="666" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="680" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cache</text>

      <!-- Origin Server -->
      <rect x="800" y="116" width="100" height="48" rx="6" fill="#fafaf9"/>
      <rect x="800" y="116" width="100" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="808" y="122" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="822" y="131" fill="rgba(28,25,23,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIGIN</text>
      <text x="850" y="150" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web Server</text>

      <!-- Summary Cards -->
      <rect x="60" y="280" width="260" height="80" rx="6" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
      <circle cx="80" cy="300" r="4" fill="#059669"/>
      <text x="92" y="304" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cache Hit</text>
      <text x="80" y="324" fill="#78716c" font-size="10" font-family="'Geist', sans-serif">Asset served from edge cache in &lt;50ms.</text>
      <text x="80" y="340" fill="#a8a29e" font-size="9" font-family="'Geist Mono', monospace">~95% of static requests</text>

      <rect x="340" y="280" width="260" height="80" rx="6" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
      <circle cx="360" cy="300" r="4" fill="#78716c"/>
      <text x="372" y="304" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cache Miss</text>
      <text x="360" y="324" fill="#78716c" font-size="10" font-family="'Geist', sans-serif">Edge fetches from origin, then caches result.</text>
      <text x="360" y="340" fill="#a8a29e" font-size="9" font-family="'Geist Mono', monospace">~5% of static requests</text>

      <rect x="620" y="280" width="320" height="80" rx="6" fill="#ffffff" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
      <circle cx="640" cy="300" r="4" fill="#0891b2"/>
      <text x="652" y="304" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Origin Offload</text>
      <text x="640" y="324" fill="#78716c" font-size="10" font-family="'Geist', sans-serif">CDN shields origin from direct traffic, reducing load.</text>
      <text x="640" y="340" fill="#a8a29e" font-size="9" font-family="'Geist Mono', monospace">Bandwidth + compute savings</text>

      <!-- Legend -->
      <line x1="30" y1="392" x2="970" y2="392" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
      <text x="30" y="408" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="400" width="8" height="8" rx="2" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1"/>
      <text x="116" y="408" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Focal</text>
      <rect x="160" y="400" width="8" height="8" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <text x="176" y="408" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Service</text>
      <line x1="240" y1="404" x2="280" y2="404" stroke="#78716c" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="288" y="408" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Return / Async</text>
      <line x1="400" y1="404" x2="440" y2="404" stroke="#78716c" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="448" y="408" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace">Conditional</text>
    </svg>
  </div>
</body>
</html>
